services:

  postgres:
    image: postgres:16-alpine
    container_name: pycodeflow-postgres-1
    restart: unless-stopped
    environment:
      POSTGRES_USER: pycodeflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pycodeflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - pycodeflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pycodeflow -d pycodeflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build: ./web
    container_name: pycodeflow-web-1
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    # Sprint 51-ai: nodig om vanuit de container een lokale AI (Ollama) op de NAS/host zelf
    # te kunnen bereiken via OLLAMA_URL=http://host.docker.internal:<poort>. Zonder deze
    # regel bestaat "host.docker.internal" niet op de meeste Linux-hosts (het werkt out-
    # of-the-box enkel op Docker Desktop/Mac/Windows) — deze standaard-Compose-regel maakt
    # het ook op Linux/NAS-installaties beschikbaar, ongeacht of Ollama gebruikt wordt.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      runner:
        condition: service_started
    mem_limit: 768m
    cpus: 1.5
    networks:
      - pycodeflow
      - runner_internal
    volumes:
      - ./logs:/app/logs
      - ./VERSION:/VERSION:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  runner:
    build: ./runner
    container_name: pycodeflow-runner-1
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - runner_internal
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
      - /work:size=64m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0

  # Sprint 51-ai: lokale AI voor "AI verbeteren" — volledig OPTIONEEL. Start enkel mee als
  # het "ollama"-profiel actief is (COMPOSE_PROFILES=ollama in .env, gezet door
  # pycodeflow.sh → configureer_ollama() zodra de gebruiker installatie via het beheerscript
  # kiest). Geen profiel actief → deze service bestaat wel in dit bestand, maar draait niet
  # en verbruikt geen resources. Zit in hetzelfde netwerk als 'web', bereikbaar op
  # http://ollama:11434 — geen host.docker.internal-omweg nodig voor deze aanpak.
  ollama:
    image: ollama/ollama:latest
    container_name: pycodeflow-ollama-1
    restart: unless-stopped
    profiles:
      - ollama
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - pycodeflow
    # Ruime maar veilige grens op een NAS zonder GPU (CPU-only inferentie) — pas gerust
    # aan in dit bestand als je hardware/gebruik daarom vraagt.
    mem_limit: 10g
    cpus: 4.0
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: pycodeflow-cloudflared-1
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - web
    networks:
      - pycodeflow

networks:
  pycodeflow:
    driver: bridge
  runner_internal:
    driver: bridge
    internal: true

volumes:
  pgdata:
  ollama_data:
