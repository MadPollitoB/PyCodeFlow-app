services:
  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - runner
    mem_limit: 768m
    cpus: 1.5
    networks:
      - pycodeflow
      - runner_internal
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data

  runner:
    build: ./runner
    restart: unless-stopped
    env_file:
      - .env

    # 🔒 Geen externe netwerktoegang voor de runner,
    # maar wel bereikbaar vanuit de webcontainer via een intern Docker-netwerk.
    networks:
      - runner_internal

    # 🔒 Security
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
      - /work:size=64m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 8g
    cpus: 5.0

networks:
  pycodeflow:
    driver: bridge
  runner_internal:
    driver: bridge
    internal: true
