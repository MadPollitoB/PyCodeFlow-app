# PyCodeFlow — docker-compose.yml
# Basis configuratie voor productie op Synology NAS
# Gebruik: docker compose up -d
# Of via: bash pycodeflow.sh

services:

  # ── PostgreSQL database ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: pycodeflow-postgres-1
    restart: unless-stopped
    environment:
      POSTGRES_USER: pycodeflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pycodeflow
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    networks:
      - pycodeflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pycodeflow -d pycodeflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Web server (Node.js) ─────────────────────────────────────────────────
  web:
    build: ./web
    container_name: pycodeflow-web-1
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      runner:
        condition: service_started
    mem_limit: 768m
    cpus: 1.5
    networks:
      - pycodeflow
      - runner_internal
    volumes:
      - ./logs:/app/logs
    # Geen data/ volume meer nodig — SQLite is vervangen door PostgreSQL

  # ── Python runner ────────────────────────────────────────────────────────
  runner:
    build: ./runner
    container_name: pycodeflow-runner-1
    restart: unless-stopped
    env_file:
      - .env

    # Geen externe netwerktoegang voor de runner
    networks:
      - runner_internal

    # Beveiliging
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
      - /work:size=64m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0

networks:
  pycodeflow:
    driver: bridge
  runner_internal:
    driver: bridge
    internal: true
