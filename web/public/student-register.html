<!DOCTYPE html>
<html lang="nl"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PyCodeFlow — Registreren</title>
<link rel="stylesheet" href="/styles.css?v=52"/>
<link rel="icon" href="/assets/favicon.png" type="image/png">
<style>
  .auth-wrap { max-width: 440px; margin: 40px auto; padding: 0 18px; }
  .auth-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 16px; padding: 26px; }
  .auth-card h1 { margin: 0 0 4px; font-size: 1.4rem; }
  .auth-card p.sub { margin: 0 0 20px; color: var(--muted); font-size: 0.9rem; }
  .field { margin-bottom: 13px; }
  .field label { display:block; font-size: 0.82rem; font-weight: 600; margin-bottom: 4px; color: var(--text); }
  .field input { width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 9px;
    font-size: 0.95rem; background: var(--bg); color: var(--text); box-sizing: border-box; }
  .field .row2 { display:flex; gap: 10px; }
  .msg { padding: 10px 12px; border-radius: 9px; font-size: 0.87rem; margin-bottom: 14px; display:none; }
  .msg.err { background:#fee2e2; color:#991b1b; display:block; }
  .msg.ok  { background:#dcfce7; color:#166534; display:block; }
  .auth-foot { margin-top: 16px; text-align:center; font-size: 0.85rem; color: var(--muted); }
  .btn-full { width:100%; justify-content:center; }
</style>
</head><body>
<div class="topbar"><div class="topbar-inner">
  <div class="logo-group"><img src="/assets/pycodeflow-logo.png" class="logo-small" alt=""/><span>PyCodeFlow</span></div>
</div></div>

<div class="auth-wrap">
  <div class="auth-card">
    <h1>Account aanmaken</h1>
    <p class="sub">Gebruik de <strong>klascode</strong> van je leerkracht en je <strong>school-e-mailadres</strong>.</p>
    <div class="msg" id="msg"></div>

    <div class="field"><label>Klascode</label>
      <input id="classCode" autocomplete="off" placeholder="bv. K7P2QX" style="text-transform:uppercase;letter-spacing:2px;font-weight:700;"/></div>
    <div class="field"><div class="row2">
      <div style="flex:1"><label>Voornaam</label><input id="firstName" autocomplete="given-name"/></div>
      <div style="flex:1"><label>Achternaam</label><input id="lastName" autocomplete="family-name"/></div>
    </div></div>
    <div class="field"><label>School-e-mailadres</label>
      <input id="email" type="email" autocomplete="email" placeholder="voornaam.naam@school.be"/></div>
    <div class="field"><label>Wachtwoord (min. 8 tekens)</label>
      <input id="password" type="password" autocomplete="new-password"/></div>
    <div class="field"><label>Wachtwoord herhalen</label>
      <input id="password2" type="password" autocomplete="new-password"/></div>

    <button class="btn btn-primary btn-full" id="submitBtn" onclick="registreer()">Account aanmaken</button>
    <div class="auth-foot">Heb je al een account? <a href="/student-login.html">Log in</a></div>
  </div>
</div>

<script>
function toon(kind, tekst){ var m=document.getElementById('msg'); m.className='msg '+kind; m.textContent=tekst; }
async function registreer(){
  var btn=document.getElementById('submitBtn'); btn.disabled=true;
  var body={
    classCode: document.getElementById('classCode').value,
    firstName: document.getElementById('firstName').value,
    lastName:  document.getElementById('lastName').value,
    email:     document.getElementById('email').value,
    password:  document.getElementById('password').value,
    password2: document.getElementById('password2').value,
  };
  try{
    var r=await fetch('/api/student/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    var d=await r.json().catch(function(){return {};});
    if(r.ok && d.ok){
      toon('ok','Account aangemaakt! Je moet nog aanvaard worden door je leerkracht. Je kan al inloggen en vrij oefenen of meedoen aan een klassessie.');
      setTimeout(function(){ window.location='/student-login.html'; }, 2200);
    } else { toon('err', d.error || 'Registreren mislukt.'); btn.disabled=false; }
  }catch(e){ toon('err','Er ging iets mis. Probeer opnieuw.'); btn.disabled=false; }
}
document.addEventListener('keydown',function(e){ if(e.key==='Enter') registreer(); });
</script>
<script src="/privacy.js?v=v2026.2.51.16"></script></body></html>
