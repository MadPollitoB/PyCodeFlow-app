<!DOCTYPE html>
<html lang="nl"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PyCodeFlow — Inloggen</title>
<link rel="stylesheet" href="/styles.css?v=52"/>
<link rel="icon" href="/assets/favicon.png" type="image/png">
<style>
  .auth-wrap { max-width: 420px; margin: 48px auto; padding: 0 18px; }
  .auth-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 16px; padding: 26px; }
  .auth-card h1 { margin: 0 0 4px; font-size: 1.4rem; }
  .auth-card p.sub { margin: 0 0 20px; color: var(--muted); font-size: 0.9rem; }
  .field { margin-bottom: 13px; }
  .field label { display:block; font-size: 0.82rem; font-weight: 600; margin-bottom: 4px; }
  .field input { width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 9px;
    font-size: 0.95rem; background: var(--bg); color: var(--text); box-sizing: border-box; }
  .msg { padding: 10px 12px; border-radius: 9px; font-size: 0.87rem; margin-bottom: 14px; display:none; }
  .msg.err { background:#fee2e2; color:#991b1b; display:block; }
  .msg.ok  { background:#dcfce7; color:#166534; display:block; }
  .auth-foot { margin-top: 16px; text-align:center; font-size: 0.85rem; color: var(--muted); }
  .btn-full { width:100%; justify-content:center; }
  #changeStep { display:none; }
</style>
</head><body>
<div class="topbar"><div class="topbar-inner">
  <div class="logo-group"><img src="/assets/pycodeflow-logo.png" class="logo-small" alt=""/><span>PyCodeFlow</span></div>
</div></div>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="msg" id="msg"></div>

    <div id="loginStep">
      <h1>Inloggen</h1>
      <p class="sub">Met je school-e-mailadres en wachtwoord.</p>
      <div class="field"><label>E-mailadres</label><input id="email" type="email" autocomplete="email"/></div>
      <div class="field"><label>Wachtwoord</label><input id="password" type="password" autocomplete="current-password"/></div>
      <button class="btn btn-primary btn-full" id="loginBtn" onclick="login()">Inloggen</button>
      <div class="auth-foot">Nog geen account? <a href="/student-register.html">Registreer je</a></div>
      <div class="auth-foot" style="margin-top:6px;"><a href="/student-recover.html">Wachtwoord vergeten?</a></div>
    </div>

    <div id="changeStep">
      <h1>Nieuw wachtwoord</h1>
      <p class="sub">Je moet eerst een nieuw wachtwoord kiezen.</p>
      <div class="field"><label>Nieuw wachtwoord (min. 8 tekens)</label><input id="np" type="password" autocomplete="new-password"/></div>
      <div class="field"><label>Herhaal wachtwoord</label><input id="np2" type="password" autocomplete="new-password"/></div>
      <button class="btn btn-primary btn-full" id="changeBtn" onclick="wijzig()">Bewaren en doorgaan</button>
    </div>
  </div>
</div>

<script>
function toon(kind, tekst){ var m=document.getElementById('msg'); m.className='msg '+kind; m.textContent=tekst; }
async function login(){
  var btn=document.getElementById('loginBtn'); btn.disabled=true;
  var body={ email:document.getElementById('email').value, password:document.getElementById('password').value };
  try{
    var r=await fetch('/api/student/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    var d=await r.json().catch(function(){return {};});
    if(r.ok && d.ok){
      if(d.mustChangePassword){
        document.getElementById('loginStep').style.display='none';
        document.getElementById('changeStep').style.display='block';
        toon('ok','Ingelogd. Kies nu een nieuw wachtwoord.');
      } else {
        window.location='/student-thuis.html';   // Sprint 73: keuzescherm na login
      }
    } else { toon('err', d.error || 'Inloggen mislukt.'); btn.disabled=false; }
  }catch(e){ toon('err','Er ging iets mis. Probeer opnieuw.'); btn.disabled=false; }
}
async function wijzig(){
  var btn=document.getElementById('changeBtn'); btn.disabled=true;
  var body={ password:document.getElementById('np').value, password2:document.getElementById('np2').value };
  try{
    var r=await fetch('/api/student/change-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    var d=await r.json().catch(function(){return {};});
    if(r.ok && d.ok){ window.location='/student-thuis.html'; }   // na wachtwoordwijziging
    else { toon('err', d.error || 'Wijzigen mislukt.'); btn.disabled=false; }
  }catch(e){ toon('err','Er ging iets mis. Probeer opnieuw.'); btn.disabled=false; }
}
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter') return;
  if(document.getElementById('changeStep').style.display==='block') wijzig(); else login();
});
</script>
<script src="/privacy.js?v=v2026.2.51.23"></script></body></html>
