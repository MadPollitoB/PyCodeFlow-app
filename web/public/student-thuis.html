<!DOCTYPE html>
<html lang="nl"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PyCodeFlow — Waar wil je naartoe?</title>
<link rel="stylesheet" href="/styles.css?v=v2026.2.51.23"/>
<link rel="icon" href="assets/favicon.png" type="image/png">
<style>
  .blok { border:1.5px solid var(--border); border-radius:12px; padding:16px; margin-bottom:16px; }
  .blok label.kop { display:block; font-weight:600; font-size:0.92rem; margin-bottom:5px; }
  .blok select, .blok input { width:100%; padding:12px 14px; border:1.5px solid var(--border);
    border-radius:12px; font-size:1rem; background:var(--surface); color:var(--text); box-sizing:border-box; }
  .banner { background:#dcfce7; color:#166534; padding:9px 13px; border-radius:10px;
    font-size:0.86rem; margin:10px 0 20px; }
  .banner.pending { background:#fef3c7; color:#92400e; }
  .code-rij { display:flex; gap:8px; }
  .code-rij input { flex:1; text-transform:uppercase; letter-spacing:1px; }
  /* Sprint 51e: tabs + resultaten */
  .tabs { display:flex; gap:6px; margin-bottom:16px; border-bottom:2px solid var(--border); }
  .tabs button { flex:1; background:none; border:none; padding:10px 6px; font-size:0.92rem; font-weight:700;
    color:var(--muted); cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-2px; }
  .tabs button.actief { color:var(--primary); border-bottom-color:var(--primary); }
  .res-kaart { border:1.5px solid var(--border); border-radius:12px; padding:13px 15px; margin-bottom:10px; cursor:pointer; }
  .res-kaart:hover { border-color:var(--primary); }
  .res-kaart .titel { font-weight:700; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .res-score { margin-left:auto; font-weight:800; }
  .res-detail { margin-top:10px; border-top:1px solid var(--border); padding-top:10px; }
  .vraag-blok { padding:10px 0; border-bottom:1px solid var(--border); }
  .vraag-blok:last-child { border-bottom:none; }
</style>
</head><body>
<div class="topbar"><div class="topbar-inner">
  <div class="logo-group"><img src="/assets/pycodeflow-logo.png" class="logo-small" alt=""/><span>PyCodeFlow</span></div>
  <div class="top-actions"><a href="/index.html" class="btn btn-muted small">Home</a></div>
</div></div>

<div class="page">
  <div class="card screen" style="max-width:600px;margin:0 auto;">
    <h1 style="margin:0;">Waar wil je naartoe?</h1>
    <div class="banner" id="banner">Laden…</div>

    <div class="tabs">
      <button id="tab-btn-deelnemen" class="actief" onclick="toonTab('deelnemen')">🚀 Deelnemen</button>
      <button id="tab-btn-resultaten" onclick="toonTab('resultaten')">📊 Mijn resultaten</button>
    </div>

    <div id="tab-deelnemen">
      <div class="blok" id="blok-lessen">
        <label class="kop">🟢 Open lessen van jouw klas</label>
        <div id="lessen-inhoud"><p class="muted" style="margin:0;font-size:0.88rem;">Laden…</p></div>
      </div>

      <div class="blok">
        <label class="kop">🔢 Ik heb een sessiecode</label>
        <p class="muted" style="font-size:0.8rem;margin:0 0 8px;">
          Voor een <strong>toets of taak</strong>, of een les die hierboven niet staat.</p>
        <div class="code-rij">
          <input id="code" placeholder="vb.: AB12CD" autocomplete="off"
                 onkeydown="if(event.key==='Enter')gaMetCode()"/>
          <button class="btn btn-muted" onclick="gaMetCode()">Ga</button>
        </div>
        <div id="code-fout" class="muted" style="font-size:0.82rem;margin-top:8px;color:#991b1b;"></div>
      </div>

      <div class="blok" id="blok-oefenen" style="border-style:dashed;">
        <button class="btn btn-soft" style="width:100%;justify-content:center;" onclick="vrijOefenen()">🐍 Vrij oefenen</button>
        <p class="muted" style="font-size:0.8rem;margin:8px 0 0;text-align:center;">
          Onder je eigen naam — je leerkracht ziet je in het overzicht.</p>
      </div>
    </div>

    <div id="tab-resultaten" style="display:none;">
      <p class="muted" style="font-size:0.85rem;margin:0 0 12px;">
        Je vrijgegeven toetsen en taken van je huidige klas. Klik een resultaat open voor de details.</p>
      <div id="resultaten-inhoud"><p class="muted" style="margin:0;font-size:0.88rem;">Laden…</p></div>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
'use strict';
let MIJ = null;

// Sprint 50 (bug 4): het keuzescherm joint voortaan via dezelfde socket-flow als het
// startscherm. Zo beslist de SERVER wat de code is: een gewone les → 'student_state'
// (naar de leerling-app), een toets/taak → 'redirect_to_quiz' (naar de toets-flow, mét
// login/aanvaarding-controle). Vroeger stuurde dit scherm ALTIJD naar /student-app.html,
// ook voor een toetscode — dan gebeurde er niets bruikbaars.
const socket = io();

function _setLS(k, v) {
  // Sprint 51i (bugfix): app.js leest deze sleutels MÉT prefix ('pycodeflow_') én JSON-geparsed.
  // Zonder die prefix vond student-app.html de studentState niet → terug naar home. We schrijven
  // nu exact zoals app.js' setLS: geprefixte sleutel + JSON.stringify.
  try { localStorage.setItem('pycodeflow_' + k, JSON.stringify(v)); } catch (e) { /* stil */ }
}

socket.on('student_state', function (data) {
  _setLS('studentSessionCode', data.session.code);
  _setLS('studentId', data.student.id);
  _setLS('studentName', data.student.name);
  _setLS('studentState', data);
  location.href = '/student-app.html';
});

socket.on('redirect_to_quiz', function (data) {
  const p = new URLSearchParams({
    code: data.code || '', name: data.name || '', class: data.className || '',
  });
  location.href = '/quiz-student.html?' + p.toString();
});

socket.on('error_message', function (msg) {
  _joinBezig(false);
  const fout = document.getElementById('code-fout');
  if (fout) fout.textContent = msg || 'Er ging iets mis. Probeer opnieuw.';
  else if (window.pyAlert) window.pyAlert(msg || 'Er ging iets mis.', 'warn');
});

function _joinBezig(bezig) {
  document.querySelectorAll('button').forEach(function (b) { b.disabled = !!bezig; });
}

function esc(x) { const d = document.createElement('div'); d.textContent = x == null ? '' : String(x); return d.innerHTML; }

async function laad() {
  try {
    const r = await fetch('/api/student/me');
    if (!r.ok) { location.href = '/student-login.html'; return; }   // niet (meer) ingelogd
    MIJ = await r.json();
  } catch (e) { location.href = '/student-login.html'; return; }

  const b = document.getElementById('banner');
  const pending = MIJ.status === 'pending';
  b.className = 'banner' + (pending ? ' pending' : '');
  b.innerHTML = 'Ingelogd als <strong>' + esc(MIJ.name || MIJ.email) + '</strong>'
    + ' · <a href="#" id="uit" style="text-decoration:underline;">uitloggen</a>'
    + (pending ? '<br/><span style="font-size:0.82rem;">Je account is nog niet aanvaard. Je kan al meedoen aan een les en vrij oefenen, maar nog niet aan een toets of taak.</span>' : '');
  document.getElementById('uit').addEventListener('click', async function (e) {
    e.preventDefault();
    await fetch('/api/student/logout', { method: 'POST' });
    location.href = '/student';
  });

  try {
    const r = await fetch('/api/student/sessions');
    const d = r.ok ? await r.json() : { sessions: [], vrijOefenen: true };
    toonLessen(d.sessions || []);
    if (d.vrijOefenen === false) {
      // Sprint 75: haal de precieze reden op (accounts uitgeschakeld, of net jouw account).
      let reden = 'Vrij oefenen is momenteel niet beschikbaar.';
      try {
        const st = await fetch('/api/free-practice/status');
        if (st.ok) { const j = await st.json(); if (j.reden) reden = j.reden; }
      } catch (e) { /* stil */ }
      document.getElementById('blok-oefenen').innerHTML =
        '<p class="muted" style="margin:0;text-align:center;font-size:0.88rem;">' + esc(reden) + '</p>';
    }
  } catch (e) { toonLessen([]); }
}

function toonLessen(lessen) {
  const doel = document.getElementById('lessen-inhoud');
  if (!lessen.length) {
    doel.innerHTML = '<p class="muted" style="margin:0;font-size:0.88rem;">Er is op dit moment geen les bezig.'
      + ' Zodra je leerkracht een sessie start, verschijnt ze hier vanzelf.</p>';
    document.getElementById('blok-lessen').style.background = 'var(--bg)';
    return;
  }
  doel.innerHTML =
    '<select id="les-keuze">' + lessen.map(function (l) {
      const tijd = new Date(l.startedAt).toLocaleTimeString('nl-BE', { hour: '2-digit', minute: '2-digit' });
      return '<option value="' + esc(l.code) + '">' + esc(l.name)
           + (l.teacher ? ' · ' + esc(l.teacher) : '') + ' · sinds ' + tijd + '</option>';
    }).join('') + '</select>'
    + '<button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:10px;" onclick="gaNaarLes()">Deelnemen aan deze les</button>';
}

function naarSessie(code) {
  // De server bepaalt op basis van de code of dit een les of een toets/taak is en
  // stuurt ons daarna door via 'student_state' of 'redirect_to_quiz'.
  const naam = (MIJ && MIJ.name) ? MIJ.name : '';
  if (!naam) {
    const fout = document.getElementById('code-fout');
    if (fout) fout.textContent = 'Je bent niet (meer) ingelogd. Log opnieuw in.';
    return;
  }
  _joinBezig(true);
  socket.emit('student_join', { name: naam, code: code, className: '' });
}

function gaNaarLes() {
  const sel = document.getElementById('les-keuze');
  const fout = document.getElementById('code-fout');
  if (fout) fout.textContent = '';
  if (sel && sel.value) naarSessie(sel.value);
}

function gaMetCode() {
  const code = (document.getElementById('code').value || '').trim().toUpperCase();
  const fout = document.getElementById('code-fout');
  if (!code) { if (fout) fout.textContent = 'Vul eerst een sessiecode in.'; return; }
  if (fout) fout.textContent = '';
  naarSessie(code);
}

function vrijOefenen() {
  // Sprint 74: schrijf naar de sleutels die de free-editor ÉCHT leest. De editor haalt
  // de naam bovendien zelf op via /api/student/me, dus dit is enkel een snelle terugval.
  try {
    localStorage.setItem('freeStudentName', MIJ?.name || '');
    localStorage.setItem('freeStudentClass', '');
  } catch (e) { /* stil */ }
  location.href = '/free-editor.html';
}

// ── Sprint 51e: tabs + "Mijn resultaten" ─────────────────────────────────────
let _resultatenGeladen = false;
function toonTab(naam) {
  const isRes = naam === 'resultaten';
  document.getElementById('tab-deelnemen').style.display = isRes ? 'none' : 'block';
  document.getElementById('tab-resultaten').style.display = isRes ? 'block' : 'none';
  document.getElementById('tab-btn-deelnemen').classList.toggle('actief', !isRes);
  document.getElementById('tab-btn-resultaten').classList.toggle('actief', isRes);
  if (isRes && !_resultatenGeladen) { _resultatenGeladen = true; laadResultaten(); }
}

function escR(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function laadResultaten() {
  const doel = document.getElementById('resultaten-inhoud');
  try {
    const r = await fetch('/api/student/my-results');
    const d = await r.json();
    const lijst = d.results || [];
    if (!lijst.length) {
      doel.innerHTML = '<p class="muted" style="margin:0;font-size:0.88rem;">Je hebt nog geen vrijgegeven resultaten. Zodra je leerkracht een toets of taak vrijgeeft, verschijnt ze hier.</p>';
      return;
    }
    doel.innerHTML = lijst.map(res => {
      const icoon = res.type === 'taak' ? '📝' : '🧪';
      const score = res.volledigVerbeterd
        ? `<span class="res-score">${res.behaald}/${res.maximum}</span>`
        : '<span class="res-score muted" style="font-weight:600;">nog niet volledig verbeterd</span>';
      const kanOpenen = res.reviewMode ? '<span class="muted" style="font-size:0.75rem;">· volledige toets inzien</span>' : '';
      return `<div class="res-kaart" onclick="toggleResultaat('${escR(res.code)}', this)">
        <div class="titel">${icoon} ${escR(res.name)} ${score}</div>
        <div class="muted" style="font-size:0.78rem;margin-top:3px;">${escR(res.className)} ${kanOpenen}</div>
        <div class="res-detail" style="display:none;"></div>
      </div>`;
    }).join('');
  } catch (e) {
    doel.innerHTML = '<p class="muted" style="color:#991b1b;">Kon je resultaten niet laden.</p>';
  }
}

async function toggleResultaat(code, kaart) {
  const detail = kaart.querySelector('.res-detail');
  if (detail.style.display === 'block') { detail.style.display = 'none'; return; }
  detail.style.display = 'block';
  detail.innerHTML = '<p class="muted" style="font-size:0.85rem;">Laden…</p>';
  try {
    const r = await fetch('/api/student/my-results/' + encodeURIComponent(code));
    const d = await r.json();
    if (!r.ok) { detail.innerHTML = '<p class="muted" style="color:#991b1b;">' + escR(d.error || 'Geen toegang.') + '</p>'; return; }
    let html = '';
    if (d.generalComment) {
      html += `<div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:0.85rem;">
        <strong>Commentaar leerkracht:</strong><br>${escR(d.generalComment)}</div>`;
    }
    html += d.questions.map((q, i) => {
      const sc = q.score != null ? `${q.score}/${q.points}` : `?/${q.points}`;
      let body = '';
      // Volledige toets enkel bij review_mode (code != null).
      if (q.code !== null && q.questionType === 'code') {
        body = `<pre style="background:#071737;color:#f9fbff;padding:10px;border-radius:8px;overflow:auto;font-size:0.8rem;margin:6px 0;">${escR(q.code || '(geen antwoord)')}</pre>`;
      }
      const comm = q.comment ? `<div style="font-size:0.82rem;color:#334155;margin-top:4px;">💬 ${escR(q.comment)}</div>` : '';
      return `<div class="vraag-blok">
        <div style="display:flex;gap:8px;align-items:baseline;">
          <strong>Vraag ${i + 1}</strong><span class="muted" style="font-size:0.8rem;">${escR((q.text||'').slice(0,80))}</span>
          <span style="margin-left:auto;font-weight:700;">${sc}</span>
        </div>${body}${comm}</div>`;
    }).join('');
    if (!d.reviewMode) {
      html += '<p class="muted" style="font-size:0.78rem;margin-top:8px;">De volledige toets is niet opengesteld. Je ziet je scores en de feedback van je leerkracht.</p>';
    }
    detail.innerHTML = html;
  } catch (e) {
    detail.innerHTML = '<p class="muted" style="color:#991b1b;">Kon dit resultaat niet laden.</p>';
  }
}

laad();
</script>
<script src="/privacy.js?v=v2026.2.51.23"></script></body></html>
