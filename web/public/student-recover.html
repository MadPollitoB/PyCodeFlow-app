<!DOCTYPE html>
<html lang="nl"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PyCodeFlow — Wachtwoord herstellen</title>
<link rel="stylesheet" href="/styles.css?v=52"/>
<link rel="icon" href="/assets/favicon.png" type="image/png">
<style>
  .auth-wrap { max-width: 440px; margin: 44px auto; padding: 0 18px; }
  .auth-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 16px; padding: 26px; }
  .auth-card h1 { margin: 0 0 4px; font-size: 1.4rem; }
  .auth-card p.sub { margin: 0 0 20px; color: var(--muted); font-size: 0.9rem; }
  .field { margin-bottom: 13px; }
  .field label { display:block; font-size: 0.82rem; font-weight: 600; margin-bottom: 4px; }
  .field input { width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 9px;
    font-size: 0.95rem; background: var(--bg); color: var(--text); box-sizing: border-box; }
  .msg { padding: 10px 12px; border-radius: 9px; font-size: 0.87rem; margin-bottom: 14px; display:none; }
  .msg.err { background:#fee2e2; color:#991b1b; display:block; }
  .msg.ok  { background:#dcfce7; color:#166534; display:block; }
  .auth-foot { margin-top: 16px; text-align:center; font-size: 0.85rem; color: var(--muted); }
  .btn-full { width:100%; justify-content:center; }
</style>
</head><body>
<div class="topbar"><div class="topbar-inner">
  <div class="logo-group"><img src="/assets/pycodeflow-logo.png" class="logo-small" alt=""/><span>PyCodeFlow</span></div>
</div></div>

<div class="auth-wrap">
  <div class="auth-card">
    <h1>Wachtwoord herstellen</h1>
    <p class="sub">Vraag je leerkracht eerst om een <strong>reset</strong>. Daarna herstel je hier met de
      <strong>klascode</strong> en je <strong>e-mailadres</strong>.</p>
    <div class="msg" id="msg"></div>

    <div class="field"><label>Klascode</label>
      <input id="classCode" autocomplete="off" style="text-transform:uppercase;letter-spacing:2px;font-weight:700;"/></div>
    <div class="field"><label>E-mailadres</label><input id="email" type="email" autocomplete="email"/></div>
    <div class="field"><label>Nieuw wachtwoord (min. 8 tekens)</label><input id="password" type="password" autocomplete="new-password"/></div>
    <div class="field"><label>Herhaal wachtwoord</label><input id="password2" type="password" autocomplete="new-password"/></div>

    <button class="btn btn-primary btn-full" id="btn" onclick="herstel()">Nieuw wachtwoord bewaren</button>
    <div class="auth-foot"><a href="/student-login.html">← Terug naar inloggen</a></div>
  </div>
</div>

<script>
function toon(k,t){ var m=document.getElementById('msg'); m.className='msg '+k; m.textContent=t; }
async function herstel(){
  var btn=document.getElementById('btn'); btn.disabled=true;
  var body={ classCode:document.getElementById('classCode').value, email:document.getElementById('email').value,
    password:document.getElementById('password').value, password2:document.getElementById('password2').value };
  try{
    var r=await fetch('/api/student/recover',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    var d=await r.json().catch(function(){return {};});
    if(r.ok && d.ok){ toon('ok','Gelukt! Je kan nu inloggen met je nieuwe wachtwoord.'); setTimeout(function(){window.location='/student-login.html';},1800); }
    else { toon('err', d.error || 'Herstellen mislukt.'); btn.disabled=false; }
  }catch(e){ toon('err','Er ging iets mis. Probeer opnieuw.'); btn.disabled=false; }
}
document.addEventListener('keydown',function(e){ if(e.key==='Enter') herstel(); });
</script>
<script src="/privacy.js?v=v2026.2.51.24"></script></body></html>
