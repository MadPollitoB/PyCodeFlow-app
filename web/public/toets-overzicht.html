<head>
  <meta charset="UTF-8"/>

  <title>PyCodeFlow — Toets overzicht</title>
  <link rel="stylesheet" href="/styles.css?v=v2026.2.49.11"/>
  <style>
    .ab-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:16px; }
    @media(max-width:900px){ .ab-grid { grid-template-columns:1fr; } }
    .a-card { background:var(--surface); border:1.5px solid var(--border); border-radius:14px; padding:16px 18px; transition:border-color .15s; }
    .a-card:hover { border-color:var(--primary); }
    .a-card.preview-card { opacity:0.85; border-style:dashed; }
    .a-meta { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
    .a-sub { font-size:0.82rem; color:var(--muted); margin-bottom:6px; }
    .a-actions { display:flex; gap:6px; margin-top:12px; flex-wrap:wrap; }
    .filter-bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
    .filter-bar select, .filter-bar input {
      padding:8px 10px; border:1.5px solid var(--border); border-radius:8px;
      font-size:0.88rem; background:var(--surface); color:var(--text); }
    .stats-bar { display:flex; gap:20px; margin-bottom:16px; flex-wrap:wrap; }
    .stat-chip { background:var(--surface-soft); border:1px solid var(--border);
      border-radius:10px; padding:8px 14px; font-size:0.85rem; }
    .stat-chip strong { color:var(--primary); }
    .group-head { margin:22px 0 6px; font-weight:800; font-size:0.9rem;
      border-bottom:1px solid var(--border); padding-bottom:4px; }
    .empty-state { color:var(--muted); text-align:center; padding:40px; }
    .a-roster { margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); }
  </style>
  <link rel="icon" href="/assets/favicon.png" type="image/png">
</head>
