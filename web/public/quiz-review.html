<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>PyCodeFlow — Toets verbeteren</title>
  <link rel="stylesheet" href="/styles.css?v=v2026.2.49.17"/>
  <style>
    .review-layout { display:grid; grid-template-columns:280px 1fr; gap:20px; }
    @media(max-width:900px){ .review-layout { grid-template-columns:1fr; } }
    .student-sidebar { display:flex; flex-direction:column; gap:6px; }
    .student-row { padding:10px 12px; border-radius:10px; border:1.5px solid var(--border);
      cursor:pointer; font-size:0.88rem; }
    .student-row:hover { border-color:var(--primary); }
    .student-row.active { background:var(--primary); color:#fff; border-color:var(--primary); }
    .student-row .score-chip { font-size:0.75rem; font-weight:700; float:right; }
    .q-tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
    .q-tab { padding:6px 14px; border-radius:8px; border:1.5px solid var(--border);
      cursor:pointer; font-size:0.85rem; font-weight:700; }
    .q-tab:hover { border-color:var(--primary); }
    .q-tab.active { background:var(--primary); color:#fff; border-color:var(--primary); }
    .q-tab.scored { border-color:#6ee7b7; }
    .similarity-warning { background:#fef3c7; border:1px solid #d97706;
      border-radius:8px; padding:8px 12px; font-size:0.85rem; color:#92400e; margin-bottom:12px; }
    .run-history-list { display:flex; flex-direction:column; gap:4px; margin-top:8px; }
    .run-history-item { padding:6px 10px; border-radius:6px; background:var(--surface-soft);
      font-size:0.78rem; cursor:pointer; font-family:Consolas,monospace; }
    .run-history-item:hover { background:var(--primary); color:#fff; }
    .score-row { display:flex; gap:12px; align-items:center; margin-top:14px; flex-wrap:wrap; }
    .score-row input[type=number] { width:70px; padding:8px; border:1.5px solid var(--border);
      border-radius:8px; font-size:1rem; text-align:center; }
    .score-row textarea { flex:1; min-width:200px; padding:8px; border:1.5px solid var(--border);
      border-radius:8px; font-size:0.88rem; resize:vertical; min-height:60px; }
    .stats-mini { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
    .stats-mini .chip { background:var(--surface-soft); border:1px solid var(--border);
      border-radius:8px; padding:6px 12px; font-size:0.82rem; }
    .template-chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
    .template-chip { padding:3px 10px; border-radius:6px; background:var(--surface-soft);
      border:1px solid var(--border); cursor:pointer; font-size:0.78rem; }
    .template-chip:hover { border-color:var(--primary); color:var(--primary); }
  </style>
  <link rel="icon" href="/assets/favicon.png" type="image/png">
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <div class="logo-group">
      <img src="/assets/pycodeflow-logo.png" class="logo-small" alt=""/>
      <span>PyCodeFlow</span>
      <span class="badge" style="margin-left:8px;">Toets verbeteren</span>
    </div>
    <div class="top-actions">
      <button class="btn btn-muted small" onclick="history.back()">← Terug</button>
      <button class="btn btn-soft small" onclick="releaseResults()">🔓 Vrijgeven</button>
      <button id="review-mode-btn" class="btn btn-muted small" onclick="toggleReviewMode()"
        title="Leerlingen kunnen hun eigen toets inkijken">👁 Nakijken: uit</button>
      <button class="btn btn-soft small" onclick="exportAll()">⬇ Exporteer alles</button>
      
    </div>
  </div>
</div>

</div></div>

<div class="screen" style="max-width:1200px;margin:0 auto;padding:20px;">
  <div style="margin-bottom:16px;">
    <h1 id="review-title" style="margin:0 0 4px;">Toets laden...</h1>
    <div class="stats-mini" id="stats-mini"></div>
    <div id="similarity-warnings"></div>
  </div>

  <div class="review-layout">
    <!-- Leerlingen sidebar -->
    <div>
      <div style="font-size:0.82rem;color:var(--muted);margin-bottom:8px;">Leerlingen</div>
      <div class="student-sidebar" id="student-list"></div>
    </div>

    <!-- Verbeterpaneel -->
    <div id="review-panel">
      <p class="muted">Selecteer een leerling om te beginnen met verbeteren.</p>
    </div>
  </div>
