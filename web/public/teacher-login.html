<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PyCodeFlow — Aanmelden</title>
<link rel="stylesheet" href="/styles.css?v=v2026.2.49.13"/>
<style>
  /* Volledig scherm overlay — blokkeert alles erachter */
  .login-overlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, rgba(35,58,99,0.55) 0%, rgba(51,78,162,0.40) 100%);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    padding: 24px;
  }

  /* Het login-card zelf */
  .login-card {
    background: #fff;
    border-radius: 28px;
    box-shadow: 0 24px 64px rgba(35,58,99,0.22), 0 2px 8px rgba(35,58,99,0.08);
    padding: 48px 44px 40px;
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    animation: slideUp 0.25s cubic-bezier(.22,.68,0,1.2) both;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(28px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0)    scale(1);    }
  }

  .login-logo {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    margin-bottom: 20px;
    background: var(--primary-soft);
  }

  .login-card h1 {
    font-size: 1.35rem;
    color: var(--text);
    margin: 0 0 4px;
    text-align: center;
    font-weight: 800;
  }

  .login-card .login-sub {
    color: var(--muted);
    font-size: 0.92rem;
    margin-bottom: 32px;
    text-align: center;
  }

  .login-fields {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 22px;
  }

  .login-fields label {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--muted);
    display: block;
    margin-bottom: 5px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }

  .login-fields input,
  .login-fields select {
    width: 100%;
    padding: 12px 16px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 1rem;
    color: var(--text);
    background: var(--surface-soft);
    outline: none;
    transition: border-color 0.15s;
  }

  .login-fields input:focus,
  .login-fields select:focus {
    border-color: var(--primary);
    background: #fff;
  }

  .login-btn {
    width: 100%;
    padding: 13px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 14px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    letter-spacing: 0.01em;
  }

  .login-btn:hover:not(:disabled) { background: #253d8a; }
  .login-btn:active:not(:disabled) { transform: scale(0.98); }
  .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .login-error {
    width: 100%;
    margin-top: 14px;
    padding: 11px 16px;
    background: var(--error-bg);
    color: var(--error-fg);
    border-radius: 11px;
    font-size: 0.9rem;
    font-weight: 600;
    text-align: center;
    display: none;
  }

  .login-error.visible { display: block; }

  .login-blocked {
    width: 100%;
    margin-top: 14px;
    padding: 11px 16px;
    background: var(--warn-bg);
    color: var(--warn-fg);
    border-radius: 11px;
    font-size: 0.9rem;
    font-weight: 600;
    text-align: center;
    display: none;
  }

  .login-blocked.visible { display: block; }

  .login-back {
    margin-top: 18px;
    font-size: 0.85rem;
    color: var(--muted);
  }

  .login-back a {
    color: var(--primary);
    text-decoration: none;
    font-weight: 600;
  }

  .login-back a:hover { text-decoration: underline; }

  /* Subtiele achtergrondpagina zichtbaar achter overlay */
  .bg-page {
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, #f7f8fb 0%, #fefefe 100%);
    z-index: 0;
  }
</style>
  <link rel="icon" href="/assets/favicon.png" type="image/png">
</head>
<body>
<!-- Achtergrond zodat het niet leeg is achter de overlay -->
<div class="bg-page"></div>

<div class="login-overlay" id="login-overlay" role="dialog" aria-modal="true" aria-labelledby="login-title">
  <div class="login-card">
    <img src="/assets/pycodeflow-logo.png" class="login-logo" alt="PyCodeFlow logo"/>
    <h1 id="login-title">Leerkrachtenplatform</h1>
    <p class="login-sub">Meld je aan om sessies te beheren.</p>

    <div class="login-fields">
      <div>
        <label for="login-user">Gebruikersnaam</label>
        <input
          type="text"
          id="login-user"
          name="username"
          autocomplete="username"
          placeholder="Gebruikersnaam"
          spellcheck="false"
          autofocus
        />
      </div>
      <div>
        <label for="login-pass">Wachtwoord</label>
        <input
          type="password"
          id="login-pass"
          name="password"
          autocomplete="current-password"
          placeholder="••••••••"
        />
      </div>
    </div>

    <button class="login-btn" id="login-btn" type="button">Aanmelden</button>

    <!-- Sprint 48b2: verschijnt ENKEL bij meerdere scholen, en pas ná een geslaagde
         login. Zo verklap je aan niemand welke scholen er bestaan. -->
    <div class="login-fields" id="school-grid" style="display:none;margin-top:14px;">
      <div>
        <label for="school-select">School</label>
        <select id="school-select"></select>
      </div>
    </div>
    <div id="school-actions" style="display:none;gap:8px;margin-top:10px;">
      <!-- flex wordt in JS gezet; de knoppen delen de breedte -->
      <button class="login-btn" id="school-cancel" type="button"
        style="background:var(--surface-soft);color:var(--text);border:1.5px solid var(--border);">Annuleren</button>
      <button class="login-btn" id="school-pick" type="button">Kiezen</button>
    </div>

    <div class="login-error" id="login-error">Gebruikersnaam of wachtwoord onjuist.</div>
    <div class="login-blocked" id="login-blocked">Te veel mislukte pogingen. Probeer later opnieuw.</div>

    <p class="login-back"><a href="/index.html">← Terug naar startpagina</a></p>
  </div>
</div>

<script src="/teacher-login.js?v=v2026.2.49.13"></script>
</body>
</html>
