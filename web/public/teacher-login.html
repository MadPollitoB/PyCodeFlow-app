<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PyCodeFlow — Aanmelden</title>
<link rel="stylesheet" href="/styles.css?v=v2026.2.51.55"/>
<style>
  /* Bugfix: dit scherm had voorheen GEEN header en GEEN footer — een losse
     fixed-overlay bovenop een lege achtergrond. Nu een gewone pagina: sticky
     header bovenaan (met "Home"), het inlogkaartje gecentreerd ertussenin, en de
     standaard footer onderaan (via footer-note.js, want deze pagina laadt geen
     app.js). De kaart zelf, de velden en alle JS/ID's blijven functioneel
     ongewijzigd. */
  /* Bugfix: eerst verticaal gecentreerd over (bijna) de volle vensterhoogte
     (calc(100vh - 220px)) — op een normaal, hoog browservenster gaf dat een
     ENORME lege ruimte boven/onder het kaartje. Nu, net als bij het
     leerling-inlogscherm (.auth-wrap: margin 48px auto), gewoon een vaste
     bovenmarge i.p.v. verticaal centreren over de hele resterende hoogte. */
  .login-overlay {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 48px;
    padding: 0 24px;
  }

  /* Het login-card zelf — Sprint 59.10: ~15% groter (gevraagd), getoetst tegen een
     1366×768 chromebookscherm: header (~92px) + bovenmarge (48px) + kaart (~500px) +
     footer (~60px) ≈ 700px, past nog net ruim binnen 768px beeldhoogte. */
  .login-card {
    background: #fff;
    border-radius: 28px;
    box-shadow: 0 24px 64px rgba(35,58,99,0.22), 0 2px 8px rgba(35,58,99,0.08);
    padding: 55px 51px 46px;
    width: 100%;
    max-width: 483px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    animation: slideUp 0.25s cubic-bezier(.22,.68,0,1.2) both;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(28px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0)    scale(1);    }
  }

  .login-logo {
    width: 74px;
    height: 74px;
    border-radius: 18px;
    margin-bottom: 20px;
    background: var(--primary-soft);
  }

  .login-card h1 {
    font-size: 1.55rem;
    color: #2d4f96;
    margin: 0 0 4px;
    text-align: center;
    font-weight: 800;
  }

  .login-card .login-sub {
    color: var(--muted);
    font-size: 1.05rem;
    margin-bottom: 32px;
    text-align: center;
  }

  .login-fields {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 22px;
  }

  .login-fields label {
    font-size: 0.94rem;
    font-weight: 700;
    color: var(--muted);
    display: block;
    margin-bottom: 5px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }

  .login-fields input,
  .login-fields select {
    width: 100%;
    padding: 14px 18px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 1.15rem;
    color: var(--text);
    background: var(--surface-soft);
    outline: none;
    transition: border-color 0.15s;
  }

  .login-fields input:focus,
  .login-fields select:focus {
    border-color: var(--primary);
    background: #fff;
  }

  .login-btn {
    width: 100%;
    padding: 15px;
    background: #26398a;
    color: #fff;
    border: none;
    border-radius: 14px;
    font-size: 1.15rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    letter-spacing: 0.01em;
  }

  .login-btn:hover:not(:disabled) { background: #1c2f6e; }

  .login-btn:active:not(:disabled) { transform: scale(0.98); }
  .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .login-error {
    width: 100%;
    margin-top: 14px;
    padding: 11px 16px;
    background: var(--error-bg);
    color: var(--error-fg);
    border-radius: 11px;
    font-size: 0.9rem;
    font-weight: 600;
    text-align: center;
    display: none;
  }

  .login-error.visible { display: block; }

  .login-blocked {
    width: 100%;
    margin-top: 14px;
    padding: 11px 16px;
    background: var(--warn-bg);
    color: var(--warn-fg);
    border-radius: 11px;
    font-size: 0.9rem;
    font-weight: 600;
    text-align: center;
    display: none;
  }

  .login-blocked.visible { display: block; }

  .login-back {
    margin-top: 18px;
    font-size: 0.85rem;
    color: var(--muted);
  }

  .login-back a {
    color: var(--primary);
    text-decoration: none;
    font-weight: 600;
  }

  .login-back a:hover { text-decoration: underline; }

  /* Subtiele achtergrond over de hele pagina (header/footer erbuiten, die hebben
     hun eigen, gewone witte achtergrond uit styles.css). */
  .bg-page {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: -1;
  }
</style>
  <link rel="icon" href="/assets/favicon.png" type="image/png">
</head>
<body class="compact-page">
<!-- Achtergrond zodat het niet leeg is -->
<div class="bg-page"></div>

<div class="topbar"><div class="topbar-inner">
  <div class="logo-group"><img src="/assets/pycodeflow-logo.png" class="logo-small" alt=""/><span>PyCodeFlow</span></div>
  <!-- Bugfix: hier stond geen enkele manier om terug naar de startpagina te gaan. -->
  <div class="top-actions"><a href="/index.html" class="btn btn-muted small">Home</a></div>
</div></div>

<div class="login-overlay" id="login-overlay">
  <div class="login-card panel-accent-blue">
    <img src="/assets/pycodeflow-logo.png" class="login-logo" alt="PyCodeFlow logo"/>
    <h1 id="login-title">Leerkrachtenplatform</h1>
    <p class="login-sub">Meld je aan om sessies te beheren.</p>

    <div class="login-fields">
      <div>
        <label for="login-user">Gebruikersnaam</label>
        <input
          type="text"
          id="login-user"
          name="username"
          autocomplete="username"
          placeholder="Gebruikersnaam"
          spellcheck="false"
          autofocus
        />
      </div>
      <div>
        <label for="login-pass">Wachtwoord</label>
        <input
          type="password"
          id="login-pass"
          name="password"
          autocomplete="current-password"
          placeholder="••••••••"
        />
      </div>
    </div>

    <button class="login-btn" id="login-btn" type="button">Aanmelden</button>

    <!-- Sprint 48b2: verschijnt ENKEL bij meerdere scholen, en pas ná een geslaagde
         login. Zo verklap je aan niemand welke scholen er bestaan. -->
    <div class="login-fields" id="school-grid" style="display:none;margin-top:14px;">
      <div>
        <label for="school-select">School</label>
        <select id="school-select"></select>
      </div>
    </div>
    <div id="school-actions" style="display:none;gap:8px;margin-top:10px;">
      <!-- flex wordt in JS gezet; de knoppen delen de breedte -->
      <button class="login-btn" id="school-cancel" type="button"
        style="background:var(--surface-soft);color:var(--text);border:1.5px solid var(--border);">Annuleren</button>
      <button class="login-btn" id="school-pick" type="button">Kiezen</button>
    </div>

    <div class="login-error" id="login-error">Gebruikersnaam of wachtwoord onjuist.</div>
    <div class="login-blocked" id="login-blocked">Te veel mislukte pogingen. Probeer later opnieuw.</div>
    <div class="accent-strip" style="width:100%;"></div>
  </div>
</div>

<script src="/teacher-login.js?v=v2026.2.51.55"></script>
<script src="/footer-note.js?v=v2026.2.51.55"></script>
<script src="/privacy.js?v=v2026.2.51.55"></script></body>
</html>
