<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>PyCodeFlow — Leerlingenoverzicht</title>
  <link rel="stylesheet" href="/styles.css?v=v2026.2.49.10"/>
  <style>
    body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans); }

    .grid-topbar {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 20px;
      background: var(--surface);
      border-bottom: 1.5px solid var(--border);
      position: sticky; top: 0; z-index: 10;
    }
    .grid-topbar h1 { margin: 0; font-size: 1.1rem; font-weight: 700; flex: 1; }
    .session-name { color: var(--muted); font-size: 0.88rem; }
    .stats-bar { display: flex; gap: 16px; font-size: 0.85rem; color: var(--muted); }
    .stats-bar strong { color: var(--text); }

    .student-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
      padding: 20px;
    }

    .student-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      transition: border-color 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    .student-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.10); }
    .student-card.running  { border-color: #4ade80; }
    .student-card.waiting  { border-color: #60a5fa; }
    .student-card.done     { border-color: #a3e635; }
    .student-card.offline  { opacity: 0.55; }
    .student-card.hand     { border-color: #fb923c; }
    .student-card.quiz-submitted { border-color: #6366f1; }

    .card-header {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px 6px;
      border-bottom: 1px solid var(--border);
    }
    .card-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--primary); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.85rem; flex-shrink: 0;
    }
    .card-name { font-weight: 700; font-size: 0.9rem; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-class { font-size: 0.75rem; color: var(--muted); }
    .card-badges { display: flex; gap: 4px; flex-shrink: 0; }
    .badge-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--border);
    }
    .badge-dot.online  { background: #22c55e; }
    .badge-dot.offline { background: #d1d5db; }

    .card-code {
      font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace;
      font-size: 0.72rem; line-height: 1.45;
      color: #d4d4d4; background: #1e1e1e;
      padding: 8px 10px;
      min-height: 72px; max-height: 92px;
      overflow: hidden;
      white-space: pre;
    }

    .card-footer {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 10px;
      font-size: 0.75rem; color: var(--muted);
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .status-chip {
      padding: 1px 7px; border-radius: 6px; font-weight: 700; font-size: 0.72rem;
    }
    .chip-running  { background: #dcfce7; color: #166534; }
    .chip-waiting  { background: #dbeafe; color: #1e40af; }
    .chip-done     { background: #f0fdf4; color: #15803d; }
    .chip-hand     { background: #ffedd5; color: #9a3412; }
    .chip-quiz     { background: #ede9fe; color: #5b21b6; }
    .chip-idle     { background: var(--surface-soft); color: var(--muted); }

    .no-students {
      grid-column: 1 / -1;
      text-align: center; padding: 60px 20px; color: var(--muted);
    }
    .no-students div { font-size: 2.5rem; margin-bottom: 12px; }

    .refresh-indicator {
      font-size: 0.78rem; color: var(--muted);
      display: flex; align-items: center; gap: 4px;
    }
    .refresh-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #22c55e;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    .sort-bar {
      display: flex; gap: 6px; align-items: center;
      font-size: 0.82rem; color: var(--muted);
    }
    .sort-bar button {
      padding: 4px 10px; border: 1.5px solid var(--border);
      border-radius: 8px; background: var(--surface);
      color: var(--text); cursor: pointer; font-size: 0.78rem;
    }
    .sort-bar button.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    .connection-status {
      padding: 10px 20px;
      background: #fee2e2; color: #991b1b;
      font-weight: 700; text-align: center;
      display: none;
    }
    .connection-status.visible { display: block; }
  </style>
  <link rel="icon" href="/assets/favicon.png" type="image/png">
</head>
<body>

<div class="connection-status" id="conn-status">
  ⚠️ Verbinding verbroken — herstellen...
</div>

<div class="grid-topbar">
  <div>
    <h1 id="grid-session-name">Leerlingenoverzicht</h1>
    <div class="session-name" id="grid-session-code"></div>
  </div>

  <div class="stats-bar">
    <span>👥 <strong id="stat-total">0</strong> leerlingen</span>
    <span>🟢 <strong id="stat-online">0</strong> online</span>
    <span>▶ <strong id="stat-running">0</strong> bezig</span>
    <span>✅ <strong id="stat-done">0</strong> klaar</span>
    <span>✋ <strong id="stat-hand">0</strong> hand</span>
  </div>

  <div class="sort-bar">
    Sorteren:
    <button onclick="setSort('naam')" id="sort-naam" class="active">Naam</button>
    <button onclick="setSort('status')" id="sort-status">Status</button>
    <button onclick="setSort('klas')" id="sort-klas">Klas</button>
  </div>

  <div class="refresh-indicator">
    <div class="refresh-dot"></div>
    Live
  </div>

  <button class="btn btn-muted small" onclick="window.close()">✕ Sluiten</button>
</div>

<div class="student-grid" id="student-grid">
  <div class="no-students">
    <div>⏳</div>
    Verbinden met sessie...
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/teacher-grid.js?v=v2026.2.49.10"></script>
<script src="/nav-rechten.js"></script></body>
</html>
